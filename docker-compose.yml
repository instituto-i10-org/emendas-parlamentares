# Banco local de desenvolvimento — Postgres 17, o mesmo major do Neon.
#
#   docker compose up -d          sobe o banco (porta 5440)
#   npx prisma migrate dev        aplica as migrações
#   npm run seed                  carrega os dados de Mogi Guaçu
#
# A porta 5440 não colide com os containers antigos do projeto (5433, 5434).
services:
  db:
    image: postgres:17-alpine
    container_name: emendas-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: emendas
      POSTGRES_PASSWORD: emendas
      POSTGRES_DB: emendas
    ports:
      - "5440:5432"
    volumes:
      - emendas_v2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emendas -d emendas"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  emendas_v2_data:
