name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Sem banco no CI: generate/typecheck/test/build não conectam.
      DATABASE_URL: ""
      DIRECT_URL: ""
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  banco:
    runs-on: ubuntu-latest
    # Aplica as migrations do zero e roda o seed completo num Postgres real:
    # confere que o schema e os dados de Mogi Guaçu carregam sem erro.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: emendas
          POSTGRES_DB: emendas_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:emendas@localhost:5433/emendas_test
      DIRECT_URL: postgresql://postgres:emendas@localhost:5433/emendas_test
      SEED_SENHA: ci-seed-senha
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run seed
